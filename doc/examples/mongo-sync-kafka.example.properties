# =============================================================================
# mongo-sync → Kafka Sink示例（对齐 mongo-kafka Source 消息格式）
# =============================================================================
# sink.uri = Kafka bootstrap.servers（可写 kafka://host:9092）
# topic 默认：{kafka.topic.prefix}{sep}{db}{sep}{coll}{sep}{suffix}
# =============================================================================

source.uri=mongodb://127.0.0.1:27017/?replicaSet=rs0
sink.type=kafka
sink.uri=127.0.0.1:9092

# ---------- 单表 ----------
source.database=demo
source.collection=orders
# 用于 topic 拼接与消息 ns 回退；默认同源
sink.database=demo
sink.collection=orders

# ---------- 或多表 ----------
# namespace.white=demo;app.orders
# kafka.topic=  固定单 topic 时取消注释（覆盖按 ns 拼接）

# ---------- Kafka（对齐 mongo-kafka） ----------
kafka.topic.prefix=mongo
kafka.topic.separator=.
# kafka.topic.suffix=
kafka.output.format=json
kafka.publish.ddl=true
kafka.acks=all
kafka.linger.ms=5
kafka.compression.type=lz4
kafka.client.id=mongo-sync
# 透传 Producer 配置（去掉 kafka.producer. 前缀）
# kafka.producer.security.protocol=SASL_SSL
# kafka.producer.sasl.mechanism=PLAIN

# ---------- 捕获 / 同步 ----------
capture.mode=AUTO
sync.mode=FULL_AND_INCREMENTAL
bootstrap.collection=false
bootstrap.indexes=false
offset.store.dir=./data/mongo-sync-offsets
