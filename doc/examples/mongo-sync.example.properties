# =============================================================================
# mongo-sync 配置示例
# =============================================================================
# 单表：MongoSyncClient.builder()...
# 多表/库：MongoMultiSyncClient + namespace.white / namespace.black
# =============================================================================

# ---------- 连接 ----------
source.uri=mongodb://127.0.0.1:27017/?replicaSet=rs0
target.uri=mongodb://127.0.0.1:27018

# ---------- 模式 A：单表 ----------
# source.database=demo
# source.collection=orders
# target.database=demo
# target.collection=orders

# ---------- 模式 B：多表 / 库级（对齐 MongoShake 白黑名单） ----------
# 白名单：分号分隔；可为整库 db 或 db.collection（与黑名单互斥）
namespace.white=demo;app.orders
# namespace.black=
# ns 变换：srcDb.srcColl:tgtDb.tgtColl
# namespace.transform=demo.orders:backup.orders_copy

# ---------- 捕获 ----------
# AUTO（默认）：按源端架构自动匹配
#   全量：standalone / RS / mongos 均可
#   副本集增量：≥3.6 → ChangeStream；更低版本 → OPLOG
#   分片增量：ChangeStream@mongos（需 MongoDB 3.6+）；不再支持多分片 OPLOG
#   standalone：仅 sync.mode=FULL
capture.mode=AUTO
# capture.mode=CHANGE_STREAM
# capture.mode=OPLOG
# mongo.version=4.4.29  # OPLOG 可省略，启动时 buildInfo 自动探测
# 旧配置 source.oplog.uris / source.oplog.shard.names 已移除，配置会直接报错

full.document=DEFAULT
enable.pre.image=false
include.from.migrate=false

# ---------- 同步模式（AND = 全量∥增量并行） ----------
sync.mode=FULL_AND_INCREMENTAL

# ---------- 元数据预建 ----------
bootstrap.collection=true
bootstrap.indexes=true
skip.ttl.indexes=true

# ---------- 写入 ----------
write.mode=UPSERT
on.conflict=FAIL
target.batch.size=1000
target.writer.threads=8

# ---------- 分桶 ----------
bucket.num=16
bucket.queue.capacity=8192
ddl.wait.seconds=30
force.single.bucket.on.unique.index=true

# ---------- 位点 ----------
# 周期日志（秒；<=0 关闭）
offset.log.interval.seconds=30
# 迁移状态 progress 日志（秒；<=0 关闭）
progress.log.interval.seconds=10
# 达到 canCommit 后自动执行 commit
# commit.when.ready=false
# 允许 commit 的最大增量滞后（毫秒）；默认 10000
# commit.max.lag.ms=10000
# 文件持久化目录（按 ns 一份文件；不配则仅内存）
offset.store.dir=./data/mongo-sync-offsets

# ---------- 全量并行读（对齐 d2t：_id 切段 + 多读线程） ----------
# 并行读线程数；1=单游标；>1 按 _id 切段并行扫描
# full.sync.parallelism=8
# 游标 batchSize
# full.sync.batch.size=1000
# 单段任务目标体积（MB），用于估算 skip 切段大小（d2t 默认 32）
# full.sync.task.mb.size=32
