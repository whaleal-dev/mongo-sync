# =============================================================================
# mongo-sync 数据比对（VerifyMain）配置示例
# =============================================================================
# 运行：
#   mvn -pl mongo-sync-client -am package -DskipTests
#   java -cp mongo-sync-client/target/mongo-sync-client-1.0.0-SNAPSHOT.jar:...(依赖)
#        com.whaleal.third.mongo.sync.verify.VerifyMain doc/examples/mongo-verify.example.properties
#
# 或：
#   mvn -pl mongo-sync-client exec:java \
#     -Dexec.mainClass=com.whaleal.third.mongo.sync.verify.VerifyMain \
#     -Dexec.args="doc/examples/mongo-verify.example.properties"
# =============================================================================

source.uri=mongodb://127.0.0.1:27017/?replicaSet=rs0
target.uri=mongodb://127.0.0.1:27018

# ---------- 单表 ----------
source.database=demo
source.collection=orders
target.database=demo
target.collection=orders

# ---------- 或多表（与同步白名单一致；配置后忽略上面单表） ----------
# namespace.white=demo;app.orders
# namespace.black=
# namespace.transform=demo.orders:backup.orders

# ---------- 比对策略 ----------
# COUNT | ID | FULL
verify.mode=FULL
# 差异样本条数上限
verify.max.samples=50
verify.batch.size=500
# 比对时忽略的字段（分号分隔），如自动时间戳
# verify.ignore.fields=updatedAt;_class
